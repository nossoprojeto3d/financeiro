# Publica o site no GitHub Pages a cada push na main.
# O site é o build que fica na raiz (gerado com `npm run build` em app/);
# aqui só junta esses arquivos e publica, sem o código-fonte.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Juntar os arquivos do site
        run: |
          mkdir _site
          cp -r index.html assets sw.js manifest.json favicon.svg og-image.jpg icons .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
