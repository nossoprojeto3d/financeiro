<body>
  <!-- Telas de entrada (login, trava, aviso de configuração) -->
  <section id="porta" class="porta"></section>

  <!-- App -->
  <div id="shell" hidden>
    <main id="main" class="main"></main>
    <nav class="nav" aria-label="Navegação">
      <button data-tela="inicio" class="ativo">
        <svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/></svg>
        <span>Início</span>
      </button>
      <button data-tela="historico">
        <svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg>
        <span>Histórico</span>
      </button>
      <button data-tela="gestao">
        <svg viewBox="0 0 24 24"><path d="M5 19V11M10 19V6M15 19v-5M20 19V9"/></svg>
        <span>Gestão</span>
      </button>
      <button data-tela="ajustes">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg>
        <span>Ajustes</span>
      </button>
    </nav>
  </div>

  <div id="sheet-fundo" class="sheet-fundo" hidden></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/lock.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
